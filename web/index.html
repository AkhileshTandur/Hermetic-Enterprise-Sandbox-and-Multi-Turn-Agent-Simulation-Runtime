<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermetic Enterprise Sandbox and Multi-Turn Agent Simulation Runtime</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1018;color:#e1e8f2}body{max-width:1200px;margin:0 auto;padding:36px}header{border-bottom:1px solid #293447;padding-bottom:24px}h1{font-size:30px;max-width:850px;line-height:1.2}small,.muted{color:#95a7bd}a{color:#6ee7c8}button,select{padding:10px 16px;border:1px solid #33445c;background:#162338;color:#e1e8f2;border-radius:6px;cursor:pointer}button:hover{border-color:#6ee7c8}section{margin:24px 0;padding:24px;background:#111b29;border:1px solid #293447;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}textarea{box-sizing:border-box;width:100%;min-height:220px;background:#080e16;color:#c8e6df;border:1px solid #33445c;padding:16px;font:13px monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:550px;overflow:auto}li{list-style:none;padding:12px 0;border-bottom:1px solid #293447}#status{color:#6ee7c8;min-height:25px}label{display:block;margin:12px 0}footer{color:#95a7bd;margin:32px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:18px}}
</style><header><small>AGENT ENGINEERING / LOCAL DEVELOPMENT</small><h1>Hermetic Enterprise Sandbox and Multi-Turn Agent Simulation Runtime</h1><p class="muted">Inspectable runs. Repeatable experiments. Measured outcomes.</p><a href="/docs">API reference ↗</a></header>
<p id="status" role="status"></p><main id="app"></main><footer>Portfolio implementation · synthetic fixtures only · benchmark results depend on your machine</footer><script>
const $=id=>document.getElementById(id);async function request(path,options){const r=await fetch(path,options);if(!r.ok)throw Error(await r.text());return r.json()}function show(value){$('detail').textContent=JSON.stringify(value,null,2)}function error(e){$('status').textContent=e.message}

$('app').innerHTML='<section><h2>Launch an evaluation</h2><label for="spec">Scenario JSON</label><textarea id="spec" spellcheck="false"></textarea><p><button id="launch">Run scenario</button> <button id="refresh">Refresh runs</button></p></section><div class="grid"><section><h2>Recent runs</h2><ul id="runs"></ul></section><section><h2>Run report</h2><pre id="detail">Select a run to inspect tool calls, checks, and final state.</pre></section></div>';
$('spec').value=JSON.stringify({name:'create-and-read',expected_status:'open',steps:[{user:'Open a VPN ticket',action:{tool:'ticket.create',arguments:{title:'VPN failure'},idempotency_key:'vpn'},expect:{status:'open'}},{user:'Read back the ticket',action:{tool:'ticket.read',arguments:{id:'$last.id'}},expect:{status:'open'}}]},null,2);
async function refresh(){const runs=await request('/runs');$('runs').replaceChildren();for(const r of runs){const li=document.createElement('li'),button=document.createElement('button');button.textContent=r.status+' · '+r.id.slice(0,12);button.onclick=()=>request('/runs/'+r.id).then(show).catch(error);li.append(button);$('runs').append(li)}}
$('launch').onclick=async()=>{try{const result=await request('/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(JSON.parse($('spec').value))});$('status').textContent='Queued '+result.run_id;await refresh()}catch(e){error(e)}};$('refresh').onclick=()=>refresh().catch(error);refresh().catch(error);
</script></html>
