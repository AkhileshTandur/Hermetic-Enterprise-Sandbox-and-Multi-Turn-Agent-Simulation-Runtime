[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "sandbox-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3", "httpx>=0.28,<1", "pyyaml>=6,<7", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "grpcio>=1.85.3,<2", "protobuf>=7.36.2,<8"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pgserver==0.1.4", "grpcio-tools>=1.70,<2"]
[tool.setuptools.packages.find]
include = ["sandbox*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
exclude = ["sandbox/generated"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
