syntax = "proto3";
package evaluation.v1;
service Evaluation {
  rpc Submit(SubmitRequest) returns (RunReply);
  rpc Get(RunRequest) returns (RunReply);
  rpc Cancel(RunRequest) returns (RunReply);
}
message SubmitRequest { string scenario_json = 1; }
message RunRequest { string run_id = 1; }
message RunReply { string run_id = 1; string status = 2; string report_json = 3; }
